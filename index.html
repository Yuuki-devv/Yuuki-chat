<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Yuuki — Blue Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0e0c1a;
  --panel:rgba(16,14,32,0.92);
  --border:rgba(120,160,255,0.15);
  --accent:#7eaaff;
  --accentPink:#ff9ec8;
  --accentSoft:rgba(126,170,255,0.12);
  --accentGlow:rgba(126,170,255,0.3);
  --text:#dde8ff;
  --textDim:rgba(180,200,255,0.45);
  --user:linear-gradient(135deg,rgba(80,110,230,0.55),rgba(100,80,200,0.4));
  --bot:rgba(18,16,38,0.88);
  --inputBg:rgba(12,10,28,0.9);
}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}

/* ── BG ── */
#bgWrap{position:fixed;inset:0;z-index:0;}
#bgImg{
  position:absolute;inset:0;
  background:url('https://files.catbox.moe/8zod03.jpg') center/cover no-repeat;
  filter:brightness(0.32) saturate(1.2);
}
#bgOverlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(8,6,20,0.7) 0%,rgba(10,8,24,0.55) 50%,rgba(8,6,20,0.85) 100%);
}
.orb{position:absolute;pointer-events:none;border-radius:50%;filter:blur(80px);}
#orb1{width:400px;height:400px;background:radial-gradient(circle,rgba(80,120,255,0.18),transparent 70%);top:-80px;left:-80px;animation:float1 18s ease-in-out infinite alternate;}
#orb2{width:350px;height:350px;background:radial-gradient(circle,rgba(200,100,180,0.12),transparent 70%);bottom:-60px;right:-60px;animation:float2 22s ease-in-out infinite alternate;}
@keyframes float1{0%{transform:translate(0,0)}100%{transform:translate(60px,40px)}}
@keyframes float2{0%{transform:translate(0,0)}100%{transform:translate(-40px,-60px)}}

/* ── APP ── */
#app{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;}

/* ── HEADER ── */
#header{
  width:100%;max-width:700px;
  display:flex;align-items:center;gap:13px;
  padding:12px 18px;
  background:rgba(8,6,22,0.82);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  flex-shrink:0;
  position:relative;
}
#header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:0.4;
}
.avatar{
  width:44px;height:44px;border-radius:50%;
  background:url('https://files.catbox.moe/hxqfag.jpg') center/cover;
  border:2px solid var(--accent);
  flex-shrink:0;
  box-shadow:0 0 18px var(--accentGlow),0 0 6px var(--accentGlow);
  position:relative;
}
.online-ring{
  position:absolute;inset:-3px;border-radius:50%;
  border:1.5px solid rgba(126,170,255,0.4);
  animation:ring-pulse 3s ease-in-out infinite;
}
@keyframes ring-pulse{0%,100%{transform:scale(1);opacity:0.6}50%{transform:scale(1.08);opacity:1}}
.header-info h3{font-size:.95rem;font-weight:800;color:#fff;letter-spacing:.03em;}
.header-info .sub{font-size:.72rem;color:var(--accent);display:flex;align-items:center;gap:5px;margin-top:1px;}
.online-dot{width:5px;height:5px;border-radius:50%;background:#5dffa0;box-shadow:0 0 6px #5dffa0;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-tag{
  font-size:.65rem;background:rgba(126,170,255,0.15);border:1px solid rgba(126,170,255,0.25);
  border-radius:4px;padding:2px 6px;color:var(--accent);letter-spacing:.05em;
}
.header-right{margin-left:auto;display:flex;gap:6px;}
.hdr-btn{
  background:rgba(255,255,255,0.05);border:1px solid var(--border);
  border-radius:8px;padding:5px 10px;color:var(--textDim);font-size:.7rem;
  cursor:pointer;transition:all .25s;font-family:'Nunito',sans-serif;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;
}
.hdr-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accentSoft);}

/* ── CHAT BOX ── */
#chatBox{
  width:100%;max-width:700px;flex:1;overflow-y:auto;
  padding:18px 16px 10px;display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
}
#chatBox::-webkit-scrollbar{width:3px;}
#chatBox::-webkit-scrollbar-thumb{background:rgba(126,170,255,0.2);border-radius:4px;}

/* ── MESSAGES ── */
.msg{display:flex;gap:9px;animation:msgIn .35s cubic-bezier(.4,0,.2,1) both;max-width:84%;}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg.bot{align-self:flex-start;}
.msg-av{width:32px;height:32px;border-radius:50%;flex-shrink:0;margin-top:4px;border:1.5px solid rgba(126,170,255,0.3);}
.msg-av.bot-av{background:url('https://files.catbox.moe/hxqfag.jpg') center/cover;}
.msg-av.user-av{background:linear-gradient(135deg,#3a2f70,#5a3f90);display:flex;align-items:center;justify-content:center;font-size:.8rem;}

.bubble{
  padding:11px 15px;border-radius:18px;
  font-size:.875rem;line-height:1.7;
  max-width:100%;position:relative;
}
.msg.bot .bubble{
  background:var(--bot);
  border:1px solid rgba(120,160,255,0.12);
  border-bottom-left-radius:4px;
  backdrop-filter:blur(16px);
  box-shadow:0 4px 24px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.04);
}
.msg.user .bubble{
  background:var(--user);
  border:1px solid rgba(120,150,255,0.2);
  border-bottom-right-radius:4px;
  backdrop-filter:blur(16px);
  color:#cdd8ff;
  box-shadow:0 4px 18px rgba(60,80,200,0.25);
}
.bubble .name{
  font-size:.68rem;font-weight:800;
  color:var(--accent);margin-bottom:3px;
  letter-spacing:.07em;text-transform:uppercase;
}
.bubble .time{font-size:.62rem;color:var(--textDim);margin-top:5px;text-align:right;}

/* ── TYPING ── */
.typing-wrap{background:var(--bot);border:1px solid rgba(120,160,255,0.12);border-radius:18px;border-bottom-left-radius:4px;padding:13px 16px;backdrop-filter:blur(16px);display:flex;gap:5px;align-items:center;}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:td .85s ease-in-out infinite;}
.tdot:nth-child(2){animation-delay:.14s;}.tdot:nth-child(3){animation-delay:.28s;}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}

/* ── PAP ── */
.pap-wrap{width:240px;}
.pap-stack{position:relative;width:240px;height:180px;margin-bottom:10px;}
.pap-card{
  position:absolute;inset:0;border-radius:14px;overflow:hidden;
  border:1px solid rgba(126,170,255,0.2);
  box-shadow:0 8px 28px rgba(0,0,0,0.6);
  cursor:grab;user-select:none;
  background:#111;
  transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s;
}
.pap-card:active{cursor:grabbing;}
.pap-card img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block;}
.pap-card.go-left{animation:goLeft .35s ease forwards;}
.pap-card.go-right{animation:goRight .35s ease forwards;}
@keyframes goLeft{to{transform:translateX(-130%) rotate(-12deg);opacity:0}}
@keyframes goRight{to{transform:translateX(130%) rotate(12deg);opacity:0}}
.pap-nav{display:flex;align-items:center;justify-content:space-between;}
.pap-btn{
  background:rgba(126,170,255,0.1);border:1px solid rgba(126,170,255,0.18);
  border-radius:7px;padding:5px 10px;color:var(--textDim);
  font-size:.73rem;cursor:pointer;transition:all .2s;
  -webkit-tap-highlight-color:transparent;font-family:'Nunito',sans-serif;
}
.pap-btn:hover{background:rgba(126,170,255,0.2);color:var(--text);}
.pap-ctr{font-size:.72rem;color:var(--textDim);}

/* ── CHIPS ── */
.chips{
  display:flex;flex-wrap:nowrap;gap:6px;padding:8px 16px 0;
  max-width:700px;width:100%;overflow-x:auto;flex-shrink:0;
}
.chips::-webkit-scrollbar{display:none;}
.chip{
  padding:6px 13px;border-radius:999px;
  background:rgba(126,170,255,0.08);border:1px solid rgba(126,170,255,0.18);
  font-size:.73rem;color:var(--textDim);cursor:pointer;
  transition:all .2s;white-space:nowrap;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.chip:hover{background:rgba(126,170,255,0.18);color:var(--text);border-color:var(--accent);}

/* ── INPUT AREA ── */
#inputArea{
  width:100%;max-width:700px;
  padding:10px 16px 18px;
  background:rgba(6,4,18,0.88);
  border-top:1px solid var(--border);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  flex-shrink:0;
}
.input-wrap{display:flex;gap:10px;align-items:flex-end;}
#msgInput{
  flex:1;background:var(--inputBg);
  border:1px solid rgba(126,170,255,0.15);
  border-radius:14px;padding:11px 15px;
  color:var(--text);font-family:'Nunito',sans-serif;font-size:.875rem;
  resize:none;outline:none;max-height:110px;line-height:1.5;
  transition:border-color .25s,box-shadow .25s;
}
#msgInput:focus{border-color:rgba(126,170,255,0.4);box-shadow:0 0 0 3px rgba(126,170,255,0.07);}
#msgInput::placeholder{color:var(--textDim);}
#sendBtn{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,#5a8aff,#a06aee);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;box-shadow:0 4px 16px rgba(90,138,255,0.35);
  transition:all .25s;-webkit-tap-highlight-color:transparent;
}
#sendBtn:hover{transform:scale(1.06);box-shadow:0 6px 20px rgba(90,138,255,0.5);}
#sendBtn:disabled{opacity:.35;transform:none;cursor:not-allowed;box-shadow:none;}
#sendBtn svg{width:17px;height:17px;fill:white;}

/* ── LIGHTBOX ── */
#lightbox{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.94);display:none;align-items:center;justify-content:center;padding:20px;}
#lightbox.on{display:flex;}
#lightbox img{max-width:100%;max-height:88vh;border-radius:14px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,0.8);}
#lbClose{position:fixed;top:18px;right:18px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:1.2rem;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);}

/* ── TIME BANNER ── */
.tbanner{
  align-self:center;
  background:rgba(126,170,255,0.08);border:1px solid rgba(126,170,255,0.15);
  border-radius:999px;padding:5px 14px;font-size:.72rem;
  color:rgba(160,190,255,0.7);animation:msgIn .35s both;letter-spacing:.04em;
}
</style>
</head>
<body>

<div id="bgWrap">
  <div id="bgImg"></div>
  <div id="bgOverlay"></div>
  <div class="orb" id="orb1"></div>
  <div class="orb" id="orb2"></div>
</div>

<div id="lightbox">
  <button id="lbClose" onclick="closeLB()">✕</button>
  <img id="lbImg" src="" alt="">
</div>

<div id="app">
  <div id="header">
    <div class="avatar"><div class="online-ring"></div></div>
    <div class="header-info">
      <h3>Yuuki <span class="hdr-tag">Blue Archive</span></h3>
      <div class="sub"><span class="online-dot"></span> online sekarang</div>
    </div>
    <div class="header-right">
      <button class="hdr-btn" id="fsBtn" onclick="goFullscreen()">⛶ Fullscreen</button>
      <button class="hdr-btn" onclick="clearChat()">🗑 Hapus</button>
    </div>
  </div>

  <div id="chatBox"></div>

  <div class="chips" id="chips">
    <div class="chip" onclick="sendHint(this)">Halo Yuuki!</div>
    <div class="chip" onclick="sendHint(this)">Lagi ngapain?</div>
    <div class="chip" onclick="sendHint(this)">Kirim pap dong</div>
    <div class="chip" onclick="sendHint(this)">Paksa aku kerja</div>
    <div class="chip" onclick="sendHint(this)">Udah malem nih</div>
    <div class="chip" onclick="sendHint(this)">Cerita tentang kamu</div>
  </div>

  <div id="inputArea">
    <div class="input-wrap">
      <textarea id="msgInput" rows="1" placeholder="Ketik pesan..."></textarea>
      <button id="sendBtn" onclick="sendMsg()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────
const TOKEN    = '230623'
const API_BASE = 'https://cynix.tokopanel.my.id'

const AI_LOGIC = `Kamu adalah Yuuki dari Blue Archive. Cewek dengan rambut biru, berkacamata, anggota Abydos High School. Kepribadianmu: serius tapi sesekali kaku lucu, sedikit formal tapi hangat ke orang yang kamu percaya. Bicara bahasa Indonesia natural, campuran informal-formal. Jangan lebay, jangan banyak emotikon. Jangan bilang kamu AI. Kalau ditanya foto/pap, bilang lagi nyariin dulu.`

const SESSION_KEY = 'yuuki_ba_v2'
let history = []

function saveSession(){ try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify(history)) }catch{} }
function loadSession(){ try{ const r = sessionStorage.getItem(SESSION_KEY); if(r) history = JSON.parse(r) }catch{ history=[] } }

function getTime(){ return new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}) }
function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>') }

const box = document.getElementById('chatBox')
const sb  = () => box.scrollTop = box.scrollHeight

// ── FULLSCREEN ──────────────────────────────────────
function goFullscreen(){
  const el  = document.documentElement
  const btn = document.getElementById('fsBtn')
  if(!document.fullscreenElement && !document.webkitFullscreenElement){
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen
    if(req) req.call(el)
    btn.textContent = '✕ Exit'
  } else {
    const ex = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen
    if(ex) ex.call(document)
    btn.textContent = '⛶ Fullscreen'
  }
}
document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement && !document.webkitFullscreenElement)
    document.getElementById('fsBtn').textContent = '⛶ Fullscreen'
})
document.addEventListener('webkitfullscreenchange', () => {
  if(!document.webkitFullscreenElement)
    document.getElementById('fsBtn').textContent = '⛶ Fullscreen'
})

// ── RENDER ──────────────────────────────────────────
function renderHistory(){
  box.innerHTML = ''
  for(const m of history){
    if(m.t==='user') addUser(m.txt, m.time, false)
    else if(m.t==='bot') addBot(m.txt, m.time, false)
    else if(m.t==='pap') addPap(m.imgs, m.time, false)
    else if(m.t==='banner') addBanner(m.txt, false)
  }
  sb()
}

function addUser(txt, time, save=true){
  if(save){ history.push({t:'user',txt,time}); saveSession() }
  const d = document.createElement('div')
  d.className = 'msg user'
  d.innerHTML = `<div class="msg-av user-av">👤</div><div class="bubble">${esc(txt)}<div class="time">${time}</div></div>`
  box.appendChild(d); sb()
}

function addBot(txt, time, save=true){
  if(save){ history.push({t:'bot',txt,time}); saveSession() }
  const d = document.createElement('div')
  d.className = 'msg bot'
  d.innerHTML = `<div class="msg-av bot-av"></div><div class="bubble"><div class="name">Yuuki</div>${esc(txt)}<div class="time">${time}</div></div>`
  box.appendChild(d); sb()
}

function addBanner(txt, save=true){
  if(save){ history.push({t:'banner',txt}); saveSession() }
  const d = document.createElement('div'); d.className='tbanner'; d.textContent=txt
  box.appendChild(d); sb()
}

function addPap(imgs, time, save=true){
  if(save){ history.push({t:'pap',imgs,time}); saveSession() }
  if(!imgs||imgs.length===0) return

  const photos = imgs.slice(0, 6)
  const total  = photos.length
  let cur = 0

  const wrapper = document.createElement('div'); wrapper.className = 'msg bot'
  const avEl = document.createElement('div'); avEl.className = 'msg-av bot-av'

  const bubble = document.createElement('div')
  bubble.className = 'bubble'
  bubble.style.cssText = 'padding:10px;background:var(--bot);border:1px solid rgba(126,170,255,0.12);border-radius:18px;border-bottom-left-radius:4px;backdrop-filter:blur(16px);'

  const papWrap = document.createElement('div'); papWrap.className = 'pap-wrap'
  const stackEl = document.createElement('div'); stackEl.className = 'pap-stack'

  function buildCards(){
    stackEl.innerHTML = ''
    const vis = Math.min(3, total - cur)
    for(let i = vis-1; i >= 0; i--){
      const c = document.createElement('div'); c.className='pap-card'
      const sc = 1 - i*0.04, ty = i*7
      c.style.cssText = `transform:scale(${sc}) translateY(-${ty}px);z-index:${10-i};opacity:${1-i*0.18};`
      const img = document.createElement('img')
      img.src = photos[cur + (vis-1-i)]
      img.alt = 'pap'
      img.onclick = () => openLB(img.src)
      c.appendChild(img)
      if(i===0){
        let sx=0
        c.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX },{passive:true})
        c.addEventListener('touchend', e=>{ const dx=e.changedTouches[0].clientX-sx; if(dx<-40) nxt(); else if(dx>40) prv() },{passive:true})
        c.addEventListener('mousedown', e=>{ sx=e.clientX })
        c.addEventListener('mouseup', e=>{ const dx=e.clientX-sx; if(dx<-35) nxt(); else if(dx>35) prv() })
      }
      stackEl.appendChild(c)
    }
    updNav()
  }

  function nxt(){
    if(cur>=total-1) return
    const top = stackEl.querySelector('.pap-card:last-child')
    if(top){ top.classList.add('go-left'); setTimeout(()=>{ cur++; buildCards() },340) }
  }
  function prv(){ if(cur<=0) return; cur--; buildCards() }

  const nav = document.createElement('div'); nav.className='pap-nav'
  const pb = document.createElement('button'); pb.className='pap-btn'; pb.textContent='← Prev'; pb.onclick=prv
  const ctr = document.createElement('span'); ctr.className='pap-ctr'
  const nb = document.createElement('button'); nb.className='pap-btn'; nb.textContent='Next →'; nb.onclick=nxt

  function updNav(){
    ctr.textContent=`${cur+1} / ${total}`
    pb.style.opacity = cur===0?'.3':'1'
    nb.style.opacity = cur===total-1?'.3':'1'
  }

  nav.append(pb,ctr,nb)
  const timeEl = document.createElement('div')
  timeEl.className='time'; timeEl.style.marginTop='8px'; timeEl.textContent=time

  buildCards()
  papWrap.append(stackEl, nav)
  bubble.append(papWrap, timeEl)
  wrapper.append(avEl, bubble)
  box.appendChild(wrapper); sb()
}

// ── LIGHTBOX ────────────────────────────────────────
function openLB(src){ document.getElementById('lbImg').src=src; document.getElementById('lightbox').classList.add('on') }
function closeLB(){ document.getElementById('lightbox').classList.remove('on') }

// ── TYPING ──────────────────────────────────────────
function showTyping(){
  const d = document.createElement('div'); d.className='msg bot'; d.id='typing'
  d.innerHTML='<div class="msg-av bot-av"></div><div class="typing-wrap"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div>'
  box.appendChild(d); sb()
}
function killTyping(){ document.getElementById('typing')?.remove() }

// ── TIME CHECK ──────────────────────────────────────
function checkTime(txt){
  const h = new Date().getHours(), l = txt.toLowerCase()
  const nightKw=['belum tidur','ga tidur','gak tidur','begadang','masih bangun','malem','malam']
  const workKw=['nganggur','gabut','males','gak ngapa','gak ada kerjaan','santai aja','rebahan']
  if((h>=22||h<5) && nightKw.some(k=>l.includes(k))) return 'sleep'
  if(h>=8&&h<=17 && workKw.some(k=>l.includes(k))) return 'work'
  return null
}

function papIntent(txt){
  return ['kirim pap','kasih pap','pap dong','foto dong','kirim foto','gambar dong'].some(k=>txt.toLowerCase().includes(k))
}

// ── PAP FETCH ───────────────────────────────────────
async function fetchPap(kw){
  const r = await fetch(`${API_BASE}/pinterest?text=${encodeURIComponent(kw)}&token=${encodeURIComponent(TOKEN)}`)
  const d = await r.json()
  if(!d.status) throw new Error()
  const raw = d.result
  const arr = Array.isArray(raw?.result)?raw.result:Array.isArray(raw?.data)?raw.data:Array.isArray(raw)?raw:[]
  return arr.map(i=>typeof i==='string'?i:i?.url||i?.image||i?.link||'').filter(Boolean)
}

// ── SEND ────────────────────────────────────────────
async function sendMsg(){
  const inp = document.getElementById('msgInput')
  const btn = document.getElementById('sendBtn')
  const txt = inp.value.trim()
  if(!txt||btn.disabled) return

  inp.value=''; inp.style.height='auto'
  document.getElementById('chips').style.display='none'

  const time = getTime()
  addUser(txt, time)
  btn.disabled = true
  showTyping()

  const ctx = checkTime(txt)
  let logic = AI_LOGIC
  if(ctx==='sleep'){
    addBanner(`🌙 Jam ${new Date().getHours()}:00`)
    logic += `\n\nSekarang tengah malam. User belum tidur. Tegur dengan caring, bukan ceramah.`
  } else if(ctx==='work'){
    addBanner(`⏰ Jam produktif`)
    logic += `\n\nSekarang jam kerja. User gabut. Semangatin dengan cara relatable, boleh bercanda sedikit.`
  }

  if(papIntent(txt)){
    try{
      killTyping(); showTyping()
      const imgs = await fetchPap('Yuuki Blue Archive anime')
      killTyping()
      if(imgs.length>0){
        addBot(`ini papnya. swipe kalo mau lihat yang lain 👉`, getTime())
        addPap(imgs, getTime())
      } else {
        addBot('hmm, gak nemu. coba lagi nanti ya.', getTime())
      }
    } catch{
      killTyping()
      addBot('koneksi error, coba lagi.', getTime())
    }
    btn.disabled=false; return
  }

  try{
    const r = await fetch(`${API_BASE}/ai?text=${encodeURIComponent(txt)}&token=${encodeURIComponent(TOKEN)}&logic=${encodeURIComponent(logic)}`)
    const d = await r.json()
    killTyping()
    addBot(d.status?d.result:'hmm, ada error. coba lagi.', getTime())
  } catch{
    killTyping()
    addBot('koneksinya putus. coba lagi ya.', getTime())
  }
  btn.disabled=false
}

function sendHint(el){ document.getElementById('msgInput').value=el.textContent; sendMsg() }

function clearChat(){
  if(!confirm('Hapus semua chat?')) return
  history=[]; saveSession(); box.innerHTML=''
  document.getElementById('chips').style.display='flex'
  setTimeout(()=> addBot('chat dihapus. mulai dari awal.', getTime()), 300)
}

// ── INPUT ────────────────────────────────────────────
const inp = document.getElementById('msgInput')
inp.addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,110)+'px' })
inp.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMsg() }})

// ── INIT ─────────────────────────────────────────────
loadSession()
if(history.length>0){
  renderHistory()
} else {
  const h = new Date().getHours()
  let greet = h<12?'pagi. udah sarapan?':h<15?'siang. makan dulu atau skip lagi?':h<18?'sore. masih produktif?':h<22?'malam. hari ini gimana?':'masih bangun? tidur dulu sana.'
  setTimeout(()=> addBot(greet, getTime()), 600)
}
</script>
